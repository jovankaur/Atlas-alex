<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Atlas AI</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:radial-gradient(circle at top right,#fce7f3,#ffffff,#e0f2fe);min-height:100vh;display:flex;justify-content:center;align-items:center}

.card{width:92vw;max-width:480px;height:88vh;background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,0.1);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,0.6)}

header{padding:1rem 1.25rem;display:flex;align-items:center;gap:0.75rem;border-bottom:1px solid rgba(0,0,0,0.06)}
.logo{width:38px;height:38px;background:linear-gradient(135deg,#a855f7,#ec4899);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:0.95rem;flex-shrink:0}
header h1{font-size:0.95rem;font-weight:600;color:#1a1a1a}
header p{font-size:0.68rem;color:#999;margin-top:1px}
.status{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:0.68rem;color:#10b981}
.dot{width:6px;height:6px;background:#10b981;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

.chat-container{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.75rem}
.chat-container::-webkit-scrollbar{width:0}

.message{display:flex;gap:0.5rem;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0}
.avatar.alex{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}
.avatar.user{background:#e0f2fe;color:#0369a1}
.bubble{max-width:78%;padding:0.7rem 0.95rem;border-radius:16px;font-size:0.85rem;line-height:1.6}
.message.alex .bubble{background:rgba(255,255,255,0.9);color:#1a1a1a;border-top-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.message.user .bubble{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;border-top-right-radius:4px}

.typing{display:none;align-items:center;gap:0.5rem}
.typing-dots{display:flex;gap:3px;background:rgba(255,255,255,0.9);padding:0.6rem 0.8rem;border-radius:16px;border-top-left-radius:4px}
.typing-dots span{width:6px;height:6px;background:#a855f7;border-radius:50%;animation:bounce 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

.suggestions{display:flex;flex-direction:column;align-items:center;gap:0.5rem;padding:0.5rem 1rem}
.suggestion{background:white;border:1px solid rgba(168,85,247,0.2);color:#7c3aed;padding:0.5rem 1rem;border-radius:12px;font-size:0.82rem;font-family:'Outfit',sans-serif;cursor:pointer;width:80%;text-align:center;transition:all 0.2s}
.suggestion:hover{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;border-color:transparent}

.input-wrap{padding:0.75rem 1rem 1rem}
.input-row{display:flex;gap:0.5rem;align-items:center;background:white;border-radius:99px;padding:0.35rem 0.35rem 0.35rem 1rem;box-shadow:0 2px 12px rgba(0,0,0,0.08);border:1px solid rgba(168,85,247,0.15)}
.mic-btn{background:transparent;border:none;padding:0.45rem;cursor:pointer;color:#a855f7;display:flex;align-items:center;flex-shrink:0;transition:color 0.2s}
.mic-btn.recording{color:#ef4444;animation:pulse 1s infinite}
.input-row input{flex:1;background:transparent;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:0.88rem;color:#1a1a1a}
.input-row input::placeholder{color:#bbb}
.send-btn{background:linear-gradient(135deg,#a855f7,#ec4899);border:none;border-radius:99px;padding:0.55rem 1rem;color:#fff;font-family:'Outfit',sans-serif;font-weight:600;font-size:0.82rem;cursor:pointer;white-space:nowrap;transition:transform 0.15s}
.send-btn:hover{transform:scale(1.04)}

footer{text-align:center;padding:0.5rem;color:#ccc;font-size:0.65rem;border-top:1px solid rgba(0,0,0,0.05)}
</style>
</head>
<body>

<div class="card">
  <header>
    <div class="logo">A</div>
    <div>
      <h1>Atlas AI</h1>
      <p>Real Estate Assistant • 24/7</p>
    </div>
    <div class="status"><div class="dot"></div>Online</div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="message alex">
      <div class="avatar alex">A</div>
      <div class="bubble">Hi there! I'm Alex, your AI real estate assistant. 👋<br><br>I'm here to help you 24/7 with buying, selling, renting, relocating or investing.<br><br>What brings you here today?</div>
    </div>
    <div class="typing" id="typing">
      <div class="avatar alex">A</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="suggestion" onclick="sendSuggestion('I want to buy a home')">🏠 Buy a home</button>
    <button class="suggestion" onclick="sendSuggestion('I want to sell my home')">💰 Sell my home</button>
    <button class="suggestion" onclick="sendSuggestion('I am relocating')">✈️ Relocating</button>
    <button class="suggestion" onclick="sendSuggestion('I want to invest in property')">📈 Invest</button>
    <button class="suggestion" onclick="sendSuggestion('Show me luxury homes')">💎 Luxury homes</button>
    <button class="suggestion" onclick="sendSuggestion('I am a first time buyer')">🔑 First time buyer</button>
  </div>

  <div class="input-wrap">
    <div class="input-row">
      <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice input">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <input type="text" id="userInput" placeholder="Ask Alex or tap mic..." onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button class="send-btn" onclick="sendMessage()">Send →</button>
    </div>
  </div>

  <footer>Powered by Atlas AI • © 2026</footer>
</div>

<script>
const sessionId = Math.random().toString(36).substr(2,9);
let isTyping = false;
let recognition = null;
let isRecording = false;
let voiceUnlocked = false;
let isVoiceMode = false;

document.addEventListener('touchstart', function(){
  if(!voiceUnlocked){
    const u = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(u);
    voiceUnlocked = true;
  }
}, {once: true});

function sendSuggestion(text){
  document.getElementById('userInput').value = text;
  sendMessage();
  document.getElementById('suggestions').style.display = 'none';
}

async function sendMessage(){
  isVoiceMode = false;
  if(isTyping) return;
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if(!message) return;
  input.value = '';
  addMessage(message, 'user');
  showTyping(true);
  isTyping = true;
  try{
    const res = await fetch('/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message, session_id: sessionId})
    });
    const data = await res.json();
    showTyping(false);
    addMessage(data.response, 'alex');
    speakResponse(data.response);
  }catch(e){
    showTyping(false);
    addMessage('Sorry, I had a brief issue. Please try again.', 'alex');
  }
  isTyping = false;
}

function addMessage(text, sender){
  const container = document.getElementById('chatContainer');
  const typing = document.getElementById('typing');
  const div = document.createElement('div');
  div.className = `message ${sender}`;
  div.innerHTML = `
    <div class="avatar ${sender}">${sender==='alex'?'A':'You'}</div>
    <div class="bubble">${text.replace(/\n/g,'<br>').replace(/\*\*/g,'').replace(/\*/g,'•')}</div>
  `;
  container.insertBefore(div, typing);
  container.scrollTop = container.scrollHeight;
}

function showTyping(show){
  const typing = document.getElementById('typing');
  typing.style.display = show ? 'flex' : 'none';
  const container = document.getElementById('chatContainer');
  container.scrollTop = container.scrollHeight;
}

function speakResponse(text){
  if(!isVoiceMode) return;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const speak = () => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.95;
    utterance.pitch = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const american = voices.find(v => v.lang === 'en-US' && v.name.includes('Samantha')) ||
                     voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
                     voices.find(v => v.lang === 'en-US') || voices[0];
    if(american) utterance.voice = american;
    window.speechSynthesis.speak(utterance);
  };
  if(window.speechSynthesis.getVoices().length === 0){
    window.speechSynthesis.onvoiceschanged = speak;
  } else { speak(); }
}

function toggleVoice(){
  isVoiceMode = true;
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
    alert('Voice not supported. Please use Chrome.');
    return;
  }
  if(isRecording){ recognition.stop(); return; }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = function(){
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
  };
  recognition.onresult = function(event){
    const transcript = event.results[0][0].transcript;
    document.getElementById('userInput').value = transcript;
    sendMessage();
  };
  recognition.onend = function(){
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.onerror = function(){
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.start();
}
</script>
</body>
</html>
