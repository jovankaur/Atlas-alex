<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Atlas AI</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Light Theme Variables */
    --bg-body: radial-gradient(circle at top right, #fce7f3, #ffffff, #e0f2fe);
    --bg-card: rgba(255, 255, 255, 0.85);
    --border-card: rgba(255, 255, 255, 0.6);
    --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.08);
    --text-main: #1a1a1a;
    --text-sub: #6b7280;
    --bg-chat: radial-gradient(ellipse at 60% 40%, #e8e0f7 0%, #f0eafa 30%, #fce8f5 60%, #eaf0fb 100%);
    --bg-bubble-alex: #f5f3fb;
    --bg-bubble-user: #ede9f8;
    --border-bubble: rgba(180, 160, 220, 0.15);
    --bg-input: #ffffff;
    --border-input: rgba(0, 0, 0, 0.08);
    --bg-suggestion: #ffffff;
    --border-suggestion: rgba(0, 0, 0, 0.1);
    --hover-suggestion: #1a1a1a;
    --text-suggestion-hover: #ffffff;
    --icon-color: #1a1a1a;
    --footer-text: #a1a1aa;
  }

  [data-theme="dark"] {
    /* Dark Theme Variables */
    --bg-body: #0f172a;
    --bg-card: rgba(30, 41, 59, 0.7);
    --border-card: rgba(255, 255, 255, 0.1);
    --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.4);
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --bg-chat: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --bg-bubble-alex: #1e293b;
    --bg-bubble-user: #334155;
    --border-bubble: rgba(255, 255, 255, 0.05);
    --bg-input: #1e293b;
    --border-input: rgba(255, 255, 255, 0.1);
    --bg-suggestion: #1e293b;
    --border-suggestion: rgba(255, 255, 255, 0.15);
    --hover-suggestion: #f8fafc;
    --text-suggestion-hover: #0f172a;
    --icon-color: #f8fafc;
    --footer-text: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
  
  body { 
    font-family: 'Outfit', sans-serif; 
    background: var(--bg-body); 
    min-height: 100vh; 
    display: flex; 
    justify-content: center; 
    align-items: center;
    padding: 1rem;
  }

  .card { 
    width: 100%; 
    max-width: 480px; 
    height: 90vh; 
    max-height: 850px;
    background: var(--bg-card); 
    backdrop-filter: blur(20px); 
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px; 
    box-shadow: var(--shadow-card); 
    display: flex; 
    flex-direction: column; 
    overflow: hidden; 
    border: 1px solid var(--border-card); 
  }

  header { 
    padding: 1.2rem; 
    display: flex; 
    align-items: center; 
    gap: 0.85rem; 
    border-bottom: 1px solid var(--border-input); 
  }
  
  .logo { 
    width: 42px; height: 42px; 
    background: transparent; 
    display: flex; align-items: center; justify-content: center; 
    font-size: 1.8rem; flex-shrink: 0; 
  }

  .header-text { flex: 1; }
  header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
  header p { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
  
  .header-actions { display: flex; align-items: center; gap: 12px; }
  
  .status { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: #10b981; font-weight: 600;}
  .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Theme Toggle Button */
  .theme-btn {
    background: transparent; border: none; cursor: pointer; color: var(--text-main);
    display: flex; align-items: center; justify-content: center; padding: 4px;
    border-radius: 50%; transition: transform 0.2s;
  }
  .theme-btn:hover { transform: scale(1.1); }
  .theme-btn svg { width: 20px; height: 20px; }

  .chat-container { 
    flex: 1; overflow-y: auto; padding: 1.5rem 1rem; display: flex; flex-direction: column; 
    gap: 1rem; background: var(--bg-chat); 
  }
  .chat-container::-webkit-scrollbar { width: 4px; }
  .chat-container::-webkit-scrollbar-thumb { background: var(--border-suggestion); border-radius: 10px; }

  .message { display: flex; gap: 0.6rem; animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { flex-direction: row-reverse; }
  
  .avatar { 
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; 
    justify-content: center; font-size: 0.8rem; font-weight: 600; flex-shrink: 0; 
  }
  .avatar.alex { background: transparent; font-size: 1.4rem; }
  .avatar.user { background: #0ea5e9; color: white; }

  .bubble { 
    max-width: 78%; padding: 0.85rem 1rem; border-radius: 20px; font-size: 0.9rem; 
    line-height: 1.5; color: var(--text-main); 
  }
  .message.alex .bubble {
    background: var(--bg-bubble-alex); border-top-left-radius: 4px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid var(--border-bubble);
  }
  .message.user .bubble {
    background: var(--bg-bubble-user); border-top-right-radius: 4px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid var(--border-bubble);
  }

  .typing { display: none; align-items: center; gap: 0.5rem; }
  .typing-dots { 
    display: flex; gap: 4px; background: var(--bg-bubble-alex); padding: 0.8rem 1rem; 
    border-radius: 18px; border-top-left-radius: 4px; border: 1px solid var(--border-bubble); 
  }
  .typing-dots span { width: 6px; height: 6px; background: var(--text-sub); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  .suggestions { 
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; 
    padding: 0.5rem 1rem 0; background: transparent;
  }
  .suggestion { 
    background: var(--bg-suggestion); border: 1px solid var(--border-suggestion); 
    color: var(--text-main); padding: 0.5rem 1rem; border-radius: 20px; 
    font-size: 0.82rem; font-family: 'Outfit', sans-serif; cursor: pointer; 
    transition: all 0.2s; white-space: nowrap;
  }
  .suggestion:hover { background: var(--hover-suggestion); color: var(--text-suggestion-hover); border-color: transparent; }

  .input-wrap { padding: 1rem; background: transparent; }
  .input-row {
    display: flex; gap: 0.5rem; align-items: center; background: var(--bg-input);
    border-radius: 20px; padding: 0.5rem 0.5rem 0.5rem 1.2rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border-input);
  }

  .mic-btn { background: transparent; border: none; padding: 0.4rem; cursor: pointer; color: var(--icon-color); display: flex; align-items: center; flex-shrink: 0; transition: color 0.2s; }
  .mic-btn.recording { color: #ef4444; animation: pulse 1s infinite; }

  .input-row input { flex: 1; background: transparent; border: none; outline: none; font-family: 'Outfit', sans-serif; font-size: 0.95rem; color: var(--text-main); }
  .input-row input::placeholder { color: var(--text-sub); }

  .send-btn {
    background: transparent; border: none; width: 40px; height: 40px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0; color: var(--icon-color);
  }
  .send-btn:hover { opacity: 0.7; }
  .send-btn svg { width: 22px; height: 22px; }

  footer { text-align: center; padding: 0.8rem; color: var(--footer-text); font-size: 0.7rem; }
</style>
</head>
<body>

<div class="card">
  <header>
    <div class="logo">✨</div>
    <div class="header-text">
      <h1>Atlas AI</h1>
      <p>Real Estate Assistant • 24/7</p>
    </div>
    <div class="header-actions">
      <button class="theme-btn" onclick="toggleTheme()" title="Switch Theme">
        <!-- Sun Icon (Hidden by default in light mode) -->
        <svg id="icon-sun" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon -->
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <div class="status"><div class="dot"></div>Online</div>
    </div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="message alex">
      <div class="avatar alex">✨</div>
      <div class="bubble">Hi there! I'm Alex, your AI real estate assistant. 👋<br><br>I'm here to help you 24/7 with buying, selling, renting, relocating or investing.<br><br>What brings you here today?</div>
    </div>
    <div class="typing" id="typing">
      <div class="avatar alex">✨</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="suggestion" onclick="sendSuggestion('I want to buy or sell a home')">🏠 Buy or Sell</button>
    <button class="suggestion" onclick="sendSuggestion('I am relocating')">✈️ Relocating</button>
    <button class="suggestion" onclick="sendSuggestion('I want to invest in property')">📈 Invest</button>
    <button class="suggestion" onclick="sendSuggestion('Show me luxury homes')">💎 Luxury</button>
  </div>

  <div class="input-wrap">
    <div class="input-row">
      <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice input">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <input type="text" id="userInput" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button class="send-btn" onclick="sendMessage()" title="Send">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <footer>Powered by Atlas AI • © 2026</footer>
</div>

<script>
// Theme Toggle Logic
function toggleTheme() {
  const body = document.documentElement;
  const iconSun = document.getElementById('icon-sun');
  const iconMoon = document.getElementById('icon-moon');
  
  if (body.getAttribute('data-theme') === 'dark') {
    body.removeAttribute('data-theme');
    iconSun.style.display = 'none';
    iconMoon.style.display = 'block';
  } else {
    body.setAttribute('data-theme', 'dark');
    iconSun.style.display = 'block';
    iconMoon.style.display = 'none';
  }
}

// System check for user's default system theme preference
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  toggleTheme();
}

// Chat Logic
const sessionId = Math.random().toString(36).substr(2,9);
let isTyping = false;
let recognition = null;
let isRecording = false;
let voiceUnlocked = false;
let isVoiceMode = false;

document.addEventListener('touchstart', function(){
  if(!voiceUnlocked){
    const u = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(u);
    voiceUnlocked = true;
  }
}, {once: true});

function sendSuggestion(text){
  document.getElementById('userInput').value = text;
  sendMessage();
  document.getElementById('suggestions').style.display = 'none';
}

async function sendMessage(){
  isVoiceMode = false;
  if(isTyping) return;
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if(!message) return;
  input.value = '';
  addMessage(message, 'user');
  showTyping(true);
  isTyping = true;
  try{
    const res = await fetch('/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message, session_id: sessionId})
    });
    const data = await res.json();
    showTyping(false);
    addMessage(data.response, 'alex');
    speakResponse(data.response);
  }catch(e){
    showTyping(false);
    addMessage('Sorry, I had a brief issue. Please try again.', 'alex');
  }
  isTyping = false;
}

function addMessage(text, sender){
  const container = document.getElementById('chatContainer');
  const typing = document.getElementById('typing');
  const div = document.createElement('div');
  div.className = `message ${sender}`;
  div.innerHTML = `
    <div class="avatar ${sender}">${sender==='alex'?'✨':'You'}</div>
    <div class="bubble">${text.replace(/\n/g,'<br>').replace(/\*\*/g,'').replace(/\*/g,'•')}</div>
  `;
  container.insertBefore(div, typing);
  container.scrollTop = container.scrollHeight;
}

function showTyping(show){
  const typing = document.getElementById('typing');
  typing.style.display = show ? 'flex' : 'none';
  const container = document.getElementById('chatContainer');
  container.scrollTop = container.scrollHeight;
}

function speakResponse(text){
  if(!isVoiceMode) return;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const speak = () => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.95;
    utterance.pitch = 1.0;
    const voices = window.speechSynthesis.getVoices();
    const american = voices.find(v => v.lang === 'en-US' && v.name.includes('Samantha')) ||
                     voices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
                     voices.find(v => v.lang === 'en-US') || voices[0];
    if(american) utterance.voice = american;
    window.speechSynthesis.speak(utterance);
  };
  if(window.speechSynthesis.getVoices().length === 0){
    window.speechSynthesis.onvoiceschanged = speak;
  } else { speak(); }
}

function toggleVoice(){
  isVoiceMode = true;
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
    alert('Voice not supported. Please use Chrome.');
    return;
  }
  if(isRecording){ recognition.stop(); return; }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = function(){
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
  };
  recognition.onresult = function(event){
    const transcript = event.results[0][0].transcript;
    document.getElementById('userInput').value = transcript;
    sendMessage();
  };
  recognition.onend = function(){
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.onerror = function(){
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.start();
}
</script>
</body>
</html>
